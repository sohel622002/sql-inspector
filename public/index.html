<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL Inspector</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="brand-mark"><img src="/logo.svg" alt="" width="16" height="16" /></span>
        <span class="brand-name">SQL Inspector</span>
      </div>

      <div class="sidebar__search">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="table-search" type="text" placeholder="Search tables..." autocomplete="off" />
      </div>

      <div class="sidebar__label">Tables</div>
      <nav id="table-list" class="table-list">
        <p class="hint">Loading tables…</p>
      </nav>

      <div class="sidebar__footer">
        <span id="status" class="status status--unknown">
          <span class="status__dot"></span>
          <span class="status__text">checking…</span>
        </span>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="topbar__title">
          <svg class="icon icon--table" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M9 4v16" stroke="currentColor" stroke-width="1.6"/></svg>
          <span id="current-table">No table selected</span>
          <span id="row-count" class="row-count"></span>
        </div>
        <div class="topbar__actions">
          <button id="theme-toggle-btn" class="btn btn--icon-only" type="button" aria-label="Toggle theme">
            <svg id="theme-icon-dark" class="icon" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg id="theme-icon-light" class="icon" viewBox="0 0 24 24" fill="none" hidden><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button id="refresh-btn" class="btn" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Refresh
          </button>
        </div>
      </header>

      <div class="search-bar">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="value-search" type="text" placeholder="Search values in this table..." autocomplete="off" disabled />
      </div>

      <div id="grid-container" class="grid-container">
        <div class="empty-state">
          <svg class="icon icon--empty" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M3 9h18M9 4v16" stroke="currentColor" stroke-width="1.4"/></svg>
          <p>Select a table to view its data.</p>
        </div>
      </div>

      <footer id="pagination-bar" class="pagination-bar" hidden>
        <div class="pagination-bar__size">
          <label for="page-size">Rows per page</label>
          <select id="page-size">
            <option value="10">10</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="pagination-bar__nav">
          <button id="page-prev" class="btn" type="button" disabled>Prev</button>
          <span id="page-status" class="pagination-bar__status">Page 1 of 1</span>
          <button id="page-next" class="btn" type="button" disabled>Next</button>
        </div>
      </footer>
    </main>
  </div>

  <div id="value-modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="value-modal-title">
      <div class="modal__header">
        <span id="value-modal-title" class="modal__title">Value</span>
        <button id="value-modal-close" class="modal__close" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <pre id="value-modal-content"></pre>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
